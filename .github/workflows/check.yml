name: Check PortWatch VI Updates

on:
  workflow_dispatch:

permissions:
  contents: write

# Stops two runs from overlapping and conflicting with each other
concurrency:
  group: portwatch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for updates and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python3 check_updates.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update PortWatch VI state"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
            git push
          fi
