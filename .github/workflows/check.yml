name: Check PortWatch VI Updates

on:
  schedule:
    # Runs every 15 minutes (free & unlimited on Public repos).
    # If your repo is Private, change */15 to */30 to stay inside the 2,000 free min/month limit.
    - cron: "*/5 * * * *"
  workflow_dispatch: # Lets you click a "Run workflow" button to test anytime

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for updates and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python check_updates.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update PortWatch VI state"
            git push
          fi
